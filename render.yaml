# Render Blueprint — starting template. Review every value in the Render dashboard before use.
# Secrets are marked `sync: false`: Render asks you to type them in; they are NOT stored in git.
services:
  - type: web
    name: traceability-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt            # pick the region closest to your Supabase project
    plan: free                   # free = sleeps after 15 min idle + SMTP blocked; see DEPLOYMENT.md
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true      # Render generates a strong random value
      - key: DATABASE_URL
        sync: false              # Supabase SESSION POOLER string (see DEPLOYMENT.md)
      - key: ALLOWED_ORIGINS
        sync: false              # https://<your-vercel-domain>
      - key: FRONTEND_URL
        sync: false              # https://<your-vercel-domain>
      - key: OPEN_REGISTRATION
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: WORKERS
        value: "1"               # free instance has 512 MB RAM
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: SHIFT_TZ
        value: Europe/Warsaw
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false              # an address on your VERIFIED Resend domain
      - key: ALERT_EMAILS
        sync: false
